<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="{{ elevation.width }}" height="{{ elevation.height }}"
     viewBox="0 0 {{ elevation.width }} {{ elevation.height }}">
  <title>{{ elevation.concept.name }} - {{ elevation.face_label|title }}</title>
  <style>
    /* Concrete colours, not the on-page CSS custom properties: this file is meant to
       be opened outside NetBox, where those variables don't exist. */
    svg { background-color: #ffffff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .unit-slot { fill: #f6f8fa; stroke: #dadfe5; stroke-width: 1; }
    .unit-label { font-size: 10px; fill: #808f9c; }
    .rack-frame { stroke: #35404a; stroke-width: 2; }
    .device-rect { stroke: rgba(0, 0, 0, 0.35); stroke-width: 1; }
    .device-label { font-size: 11px; }
    .device-image-label { font-size: 11px; }
    .device-image-label-stroke { fill: none; stroke: #000000; stroke-width: 0.2em; stroke-linejoin: round; }
    .device-image-label-fill { fill: #ffffff; }
    .opposite-hint { font-size: 9px; opacity: 0.8; }
    .device-block.opposite .device-rect { stroke-dasharray: 3 2; }
    .add-device-hint { display: none; }
  </style>
  {% include 'netbox_rack_concept/inc/elevation_svg_content.html' %}
</svg>
