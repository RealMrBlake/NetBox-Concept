{% load i18n %}
<div class="concept-elevation" data-face="{{ elevation.face }}">
  <h5 class="text-center text-muted mb-2">{{ elevation.face_label|title }}</h5>
  <svg width="{{ elevation.width }}" height="{{ elevation.height }}"
       viewBox="0 0 {{ elevation.width }} {{ elevation.height }}"
       class="concept-elevation-svg" role="img"
       aria-label="{% blocktrans with face=elevation.face_label name=elevation.concept.name %}{{ face }} elevation of {{ name }}{% endblocktrans %}">
    {% include 'netbox_rack_concept/inc/elevation_svg_content.html' %}
  </svg>
</div>
